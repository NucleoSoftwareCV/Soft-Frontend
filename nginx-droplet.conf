# ============================================================
# nginx-droplet.conf
# Configuración para el servidor VPS (DigitalOcean Droplet).
# Se instala en /etc/nginx/sites-available/ en el servidor.
#
# ANTES DE USAR:
#   1. Reemplaza "tudominio.com" con tu dominio real
#   2. Obtén certificado SSL: sudo certbot --nginx -d tudominio.com -d www.tudominio.com
#   3. Certbot rellenará automáticamente los paths de ssl_certificate
# ============================================================

# Redirigir HTTP → HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name tudominio.com www.tudominio.com;

  # Verificación de Let's Encrypt (certbot)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# Servidor HTTPS principal
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name tudominio.com www.tudominio.com;

  # ── SSL — Certbot rellenará estas rutas automáticamente ──
  # ssl_certificate     /etc/letsencrypt/live/tudominio.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;
  # include             /etc/letsencrypt/options-ssl-nginx.conf;
  # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  # ── Seguridad ──
  server_tokens off;
  add_header X-Frame-Options           "SAMEORIGIN"   always;
  add_header X-Content-Type-Options    "nosniff"      always;
  add_header X-XSS-Protection          "1; mode=block" always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Compresión
  gzip            on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied    any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  # Tamaño máximo de cuerpo
  client_max_body_size 10M;

  # Timeouts
  proxy_connect_timeout 60s;
  proxy_send_timeout    60s;
  proxy_read_timeout    60s;

  # ── Upstream: Angular SSR corriendo en el Droplet ──
  # El contenedor Docker expone el puerto 4000 en localhost del host
  upstream angular_ssr {
    server 127.0.0.1:4000;
    keepalive 32;
  }

  # ── Assets estáticos con caché agresiva ──
  location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
    proxy_pass         http://angular_ssr;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;

    expires    1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # ── Todo lo demás → Angular SSR ──
  location / {
    proxy_pass         http://angular_ssr;
    proxy_http_version 1.1;

    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # ── Healthcheck externo ──
  location /health {
    access_log off;
    return 200 "OK\n";
    add_header Content-Type text/plain;
  }
}
