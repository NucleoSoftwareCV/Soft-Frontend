<div class="login-layout">
  <div class="login-image" aria-hidden="true">
    <img src="https://images.unsplash.com/photo-1599901860904-17e6ed7083a0?w=900&auto=format&fit=crop&q=85" alt=""
      class="login-image__img" width="900" height="1200" />
  </div>

  <main class="login-panel" aria-labelledby="forgot-title">
    <a routerLink="/" class="login-panel__logo" aria-label="Oona — Volver al inicio">
      oona.
    </a>

    @if (errorMessage()) {
    <div class="login-error-message" role="alert">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="8" x2="12" y2="12" />
        <line x1="12" y1="16" x2="12.01" y2="16" />
      </svg>
      <span>{{ errorMessage() }}</span>
    </div>
    }

    @if (successMessage()) {
    <h1 class="login-panel__title" id="forgot-title">
      Revisa tu email
    </h1>
    <p style="text-align: center; color: var(--color-ink-light); margin-bottom: var(--space-4);">
      {{ successMessage() }}
    </p>
    <p class="login-register" style="text-align: center;">
      <a routerLink="/auth/login" class="login-register__link">Volver a iniciar sesión</a>
    </p>
    } @else {
    <h1 class="login-panel__title" id="forgot-title">
      ¿Has olvidado<br><em>tu contraseña?</em>
    </h1>
    <p style="text-align: center; color: var(--color-ink-light); margin-bottom: var(--space-4); font-size: var(--text-sm);">
      Escribe tu email y te enviaremos un enlace para restablecerla.
    </p>

    <form class="login-form" (ngSubmit)="onSubmit()" novalidate>
      <div class="login-field">
        <label for="forgot-email" class="login-field__label">EMAIL</label>
        <input id="forgot-email" type="email" name="forgotEmail" class="login-field__input" placeholder="tu@email.com"
          [ngModel]="email()" (ngModelChange)="email.set($event)" autocomplete="email" required />
      </div>

      <button type="submit" class="login-submit" [disabled]="isLoading()">
        @if (isLoading()) {
        <span class="login-submit__spinner" aria-hidden="true"></span> Enviando...
        } @else {
        Enviar enlace de recuperación
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <polyline points="9 18 15 12 9 6" />
        </svg>
        }
      </button>
    </form>

    <p class="login-register">
      <a routerLink="/auth/login" class="login-register__link">Volver a iniciar sesión</a>
    </p>
    }
  </main>
</div>
