<section class="events-section" aria-labelledby="events-title">
  <div class="container">
    <header class="events-section__header">
      <div>
        <p class="events-section__eyebrow">Próximamente</p>
        <h2 id="events-title" class="events-section__title">Eventos destacados</h2>
      </div>
      <a routerLink="/eventos/todos" class="btn-outline">Ver todos los eventos</a>
    </header>

    <ul class="events-section__grid" role="list">
      @for (event of events; track event.id) {
        <li>
          <article class="event-card">
            <!-- Imagen -->
            <a [routerLink]="['/eventos', event.id]" class="event-card__img-wrap" tabindex="-1" aria-hidden="true">
              <img
                [src]="event.image"
                [alt]="event.title"
                class="event-card__img"
                loading="lazy"
                width="560"
                height="320"
              />
              <span class="event-card__category">{{ event.category }}</span>
            </a>

            <!-- Cuerpo -->
            <div class="event-card__body">
              <a [routerLink]="['/eventos', event.id]" class="event-card__title-link">
                <h3 class="event-card__title">{{ event.title }}</h3>
              </a>

              <ul class="event-card__meta" aria-label="Detalles del evento">
                <li class="event-card__meta-item">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                    <rect x="3" y="4" width="18" height="18" rx="2"/>
                    <path d="M16 2v4M8 2v4M3 10h18"/>
                  </svg>
                  {{ event.date }} · {{ event.time }}
                </li>
                <li class="event-card__meta-item">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                    <circle cx="12" cy="10" r="3"/>
                  </svg>
                  {{ event.location }}
                </li>
              </ul>

              <div class="event-card__footer">
                <span class="event-card__price">{{ event.price }}</span>
                <a [routerLink]="['/eventos', event.id]" class="btn-primary event-card__cta">
                  Ver evento
                </a>
              </div>
            </div>
          </article>
        </li>
      }
    </ul>
  </div>
</section>
