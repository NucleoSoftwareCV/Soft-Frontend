<section class="categories" aria-labelledby="categories-title">
  <div class="container">
    <header class="categories__header">
      <h2 id="categories-title" class="categories__title">Explora por categoría</h2>
      <a routerLink="/eventos" class="categories__see-all">Ver todos →</a>
    </header>

    <ul class="categories__grid" role="list">
      @for (cat of categories; track cat.path) {
        <li>
          <a
            [routerLink]="cat.path"
            class="categories__item"
            [style.--cat-color]="cat.color"
          >
            <span class="categories__emoji" aria-hidden="true">{{ cat.emoji }}</span>
            <span class="categories__label">{{ cat.label }}</span>
          </a>
        </li>
      }
    </ul>
  </div>
</section>
