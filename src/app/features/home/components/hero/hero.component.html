<section class="hero" aria-label="Sección principal">

  <!-- Pill "Nuevo" -->
  <div class="hero__announce-wrap">
    <a routerLink="/conocer-gente" class="hero__announce">
      <span class="hero__announce-icon" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
      </span>
      <span>Nuevo: Conoce gente para planes de bienestar</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </a>
  </div>

  <!-- Banner principal -->
  <div class="hero__media-wrap">

    <!--
      VIDEO pendiente — cuando lo tengas:
      1. Elimina el div.hero__video-placeholder
      2. Añade:
         <video class="hero__video" autoplay muted loop playsinline aria-hidden="true">
           <source src="assets/videos/hero.mp4" type="video/mp4" />
         </video>
    -->
    <div class="hero__video-placeholder" aria-hidden="true"></div>

    <!-- Degradado -->
    <div class="hero__overlay" aria-hidden="true"></div>

    <!-- Contenido -->
    <div class="hero__content">

      <h1 class="hero__headline">
        Experiencias de<br>
        bienestar<br>
        en <em>{{ city() }}</em>
      </h1>

      <p class="hero__sub">
        Descubre yoga, meditación, talleres y retiros de bienestar<br>
        seleccionados para tu día a día.
      </p>

      <!-- Buscador con dropdown inspiración -->
      <div class="hero__search-wrap" role="search">
        <div class="hero__search">
          <svg class="hero__search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input
            type="search"
            class="hero__search-input"
            placeholder="Buscar yoga, meditación, retiros..."
            [value]="searchQuery()"
            (input)="searchQuery.set($any($event.target).value)"
            (focus)="onFocus()"
            (blur)="onBlur()"
            aria-label="Buscar experiencias de bienestar"
            autocomplete="off"
          />
          <button class="hero__search-filter" type="button" aria-label="Abrir filtros">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <line x1="4" y1="6" x2="20" y2="6"/>
              <line x1="8" y1="12" x2="16" y2="12"/>
              <line x1="11" y1="18" x2="13" y2="18"/>
            </svg>
          </button>
        </div>

        <!-- Dropdown ¿Necesitas inspiración? -->
        @if (isSearchFocused() && !searchQuery()) {
          <div class="hero__inspiration" role="listbox" aria-label="Sugerencias de búsqueda">
            <p class="hero__inspiration-title">¿NECESITAS INSPIRACIÓN?</p>
            <div class="hero__inspiration-grid">
              @for (tag of inspirationTags; track tag) {
                <button
                  class="hero__inspiration-tag"
                  role="option"
                  type="button"
                  (mousedown)="selectTag(tag)"
                >{{ tag }}</button>
              }
            </div>
          </div>
        }
      </div>

    </div>
  </div>

</section>
