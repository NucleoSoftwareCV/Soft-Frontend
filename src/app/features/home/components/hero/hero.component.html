<section class="hero" aria-label="Sección principal">

  <!-- Pill "Nuevo" -->
  <div class="hero__announce-wrap">
    <a routerLink="/conocer-gente" class="hero__announce">
      <span class="hero__announce-icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
          <path d="M20 3v4M22 5h-4M4 17v2M5 18H3"/>
        </svg>
      </span>
      <span>Nuevo: Conoce gente para planes de bienestar</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </a>
  </div>

  <!-- Wrapper con mismo ancho que .container -->
  <div class="hero__outer">

    <!-- Banner principal -->
    <div class="hero__media-wrap">
      <div class="hero__media" aria-hidden="true">
        <img
          class="hero__poster"
          src="https://cdn.oona.es/storage/v1/object/public/content_images/home/hero-poster.webp"
          alt=""
        />
        <video
          class="hero__video"
          autoplay
          muted
          loop
          playsinline
          preload="metadata"
          poster="https://cdn.oona.es/storage/v1/object/public/content_images/home/hero-poster.webp"
        >
          <source src="https://cdn.oona.es/storage/v1/object/public/content_videos/home/hero-home-video-v1.mp4" type="video/mp4" />
        </video>
        <div class="hero__overlay"></div>
      </div>

      <!-- Contenido: headline + subtítulo + buscador -->
      <div class="hero__content">
        <h1 class="hero__headline">
          Experiencias de<br>
          bienestar<br>
          en <em>{{ city() }}</em>
        </h1>

        <p class="hero__sub">
          Descubre yoga, meditación, talleres y retiros de bienestar
          seleccionados para tu día a día.
        </p>

        <div class="hero__search-outer" role="search">
          <div class="hero__search">
            <svg class="hero__search-icon" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            </svg>
            <input
              type="search"
              class="hero__search-input"
              placeholder="Buscar yoga, meditación, retiros..."
              [value]="searchQuery()"
              (input)="searchQuery.set($any($event.target).value)"
              (focus)="onFocus()"
              (blur)="onBlur()"
              aria-label="Buscar experiencias de bienestar"
              autocomplete="off"
            />
            <button
              class="hero__search-filter"
              type="button"
              aria-label="Abrir filtros de búsqueda"
              (click)="openFilter.emit()"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/>
                <line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/>
                <line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/>
                <line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/>
                <line x1="16" x2="16" y1="18" y2="22"/>
              </svg>
            </button>
          </div>

          @if (isSearchFocused() && !searchQuery()) {
            <div class="hero__inspiration" role="listbox" aria-label="Sugerencias de búsqueda">
              <p class="hero__inspiration-title">¿NECESITAS INSPIRACIÓN?</p>
              <div class="hero__inspiration-grid">
                @for (tag of inspirationTags; track tag) {
                  <button
                    class="hero__inspiration-tag"
                    role="option"
                    type="button"
                    (mousedown)="selectTag(tag)"
                  >{{ tag }}</button>
                }
              </div>
            </div>
          }
        </div>

      </div>
    </div>

  </div>

</section>
