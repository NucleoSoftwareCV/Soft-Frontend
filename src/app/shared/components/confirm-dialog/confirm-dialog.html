@if (open()) {
  <div class="confirm-dialog__backdrop" (click)="cancel()">
    <section
      class="confirm-dialog"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirm-dialog-title"
      aria-describedby="confirm-dialog-description"
      (click)="$event.stopPropagation()">
      <button
        class="confirm-dialog__close"
        type="button"
        aria-label="Cerrar"
        [disabled]="loading()"
        (click)="cancel()">
        <svg lucideX aria-hidden="true"></svg>
      </button>

      <div class="confirm-dialog__icon" aria-hidden="true">
        <svg lucideTriangleAlert></svg>
      </div>
      <div class="confirm-dialog__content">
        <h2 id="confirm-dialog-title">{{ title() }}</h2>
        <p id="confirm-dialog-description">{{ description() }}</p>
        @if (reasonLabel()) {
          <label class="confirm-dialog__reason">
            <span>{{ reasonLabel() }}</span>
            <textarea rows="3" [attr.maxlength]="reasonMaxLength()" [placeholder]="reasonPlaceholder()"
              [ngModel]="reason()" (ngModelChange)="reason.set($event)" [disabled]="loading()"></textarea>
            <small>{{ reason().length }}/{{ reasonMaxLength() }}</small>
          </label>
          @if (reasonRequired() && reasonTouched() && !reason().trim()) {
            <p class="confirm-dialog__error" role="alert">Escribe un motivo para continuar.</p>
          }
        }
      </div>

      <footer class="confirm-dialog__actions">
        <button
          class="confirm-dialog__button confirm-dialog__button--secondary"
          type="button"
          [disabled]="loading()"
          (click)="cancel()">
          {{ cancelLabel() }}
        </button>
        <button
          class="confirm-dialog__button confirm-dialog__button--danger"
          type="button"
          [disabled]="loading()"
          (click)="confirm()">
          {{ loading() ? 'Procesando...' : confirmLabel() }}
        </button>
      </footer>
    </section>
  </div>
}
