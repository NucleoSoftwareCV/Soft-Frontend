<div class="toast-region" role="status" aria-live="polite">
  @for (toast of toastService.toasts(); track toast.id) {
  <div class="toast" [class.toast--success]="toast.type === 'success'"
    [class.toast--error]="toast.type === 'error'" [class.toast--info]="toast.type === 'info'">
    <span class="toast__text">{{ toast.text }}</span>
    <button type="button" class="toast__close" (click)="toastService.dismiss(toast.id)"
      aria-label="Cerrar notificación">×</button>
  </div>
  }
</div>
