# ============================================================
# nginx-container.conf
# Reverse proxy para uso dentro de docker-compose.
# Nginx escucha en :80 y reenvía al contenedor Angular en :4000
# ============================================================

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Logging
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  # Compresión gzip
  gzip            on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied    any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  # Ocultar versión de nginx
  server_tokens off;

  # ── Upstream: el contenedor Angular SSR ──
  # "angular" es el nombre del servicio en docker-compose.yml
  upstream angular_ssr {
    server angular:4000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name localhost;

    # Tamaño máximo de cuerpo de petición
    client_max_body_size 10M;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ── Assets estáticos con caché agresiva ──
    # Angular los sirve con hash en el nombre → se pueden cachear 1 año
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
      proxy_pass         http://angular_ssr;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_set_header   Host $host;

      # Caché en el cliente
      expires     1y;
      add_header  Cache-Control "public, immutable";
      access_log  off;
    }

    # ── Todo lo demás → Angular SSR ──
    location / {
      proxy_pass         http://angular_ssr;
      proxy_http_version 1.1;

      # Headers necesarios para SSR y WebSockets
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Sin caché para las páginas SSR
      add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Healthcheck interno ──
    location /nginx-health {
      access_log off;
      return 200 "OK\n";
      add_header Content-Type text/plain;
    }
  }
}
